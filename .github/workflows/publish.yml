name: publish

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      files:
        description: "Пути Day_*.md от корня репозитория (через пробел); пусто — взять из launch/schedule.tsv"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick today's files
        if: ${{ inputs.files == '' }}
        id: schedule
        run: |
          TODAY=$(date -u +%F)
          FILES=$(awk -F'\t' -v d="$TODAY" '$1==d && $5!="done" {printf "%s ", $3}' launch/schedule.tsv)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "files=$(echo $FILES)" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          DISCUSS_URL: ${{ secrets.DISCUSS_URL }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REPO_BRANCH: ${{ github.ref_name }}
        run: |
          FILES="${{ inputs.files }}"
          if [ -z "$FILES" ]; then
            FILES="${{ steps.schedule.outputs.files }}"
          fi
          if [ -z "$FILES" ]; then
            echo "на ${{ steps.schedule.outputs.today }} в launch/schedule.tsv ничего не запланировано"
            exit 0
          fi
          python3 -m pipeline.publisher --publish $FILES
